<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ERROR - CRITICAL WARNING</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        .container {
            text-align: center;
            border: 2px solid #ff0000;
            padding: 40px;
            box-shadow: 0 0 20px #ff0000;
            background-color: rgba(20, 0, 0, 0.9);
            max-width: 90%;
            border-radius: 8px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
            animation: blink 0.8s infinite alternate;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .ip-info {
            color: #ff3333;
            font-weight: bold;
            margin-top: 20px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
        }

        .btn-start {
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px 30px;
            font-family: monospace;
            font-size: 1.2rem;
            background: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px #00ff00;
        }

        @keyframes blink {
            0% { opacity: 1; text-shadow: 0 0 10px #ff0000; }
            100% { opacity: 0.3; text-shadow: 0 0 2px #ff0000; }
        }
    </style>
</head>
<body>

    <!-- Capa previa obligatoria porque los navegadores bloquean el audio sin interacción previa del usuario -->
    <div class="overlay" id="startOverlay">
        <button class="btn-start">>>> CLICK PARA CONTINUAR <<<</button>
    </div>

    <div class="container">
        <h1>¡HAS SIDO HACKEADO!</h1>
        <p>Todos tus archivos, fotos y contraseñas han sido encriptados.</p>
        <p>Iniciando transferencia de datos a un servidor remoto...</p>
        <p class="ip-info">IP DETECTADA: <span id="userIp">192.168.1.105</span></p>
        <p class="ip-info">ESTADO DEL SISTEMA: <span style="color: red; font-weight: bold;">COMPROMETIDO</span></p>
    </div>

    <script>
        const overlay = document.getElementById('startOverlay');

        // Generador de sonido aterrador usando la Web Audio API del navegador
        function playScarySound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Oscilador 1: Tono ultra grave (sub-bass)
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(40, audioCtx.currentTime); // Frecuencia muy baja

            // Oscilador 2: Tono disonante para distorsión y vibra de terror
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(43.5, audioCtx.currentTime); // Ligeramente desfasado genera disonancia

            // Control de volumen / Ganancia
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
            // Sube de golpe el volumen para dar el susto y luego mantiene el zumbido
            gainNode.gain.exponentialRampToValueAtTime(0.8, audioCtx.currentTime + 0.1);

            // Conexiones de audio
            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // Arrancar el sonido
            osc1.start();
            osc2.start();

            // Efecto modulador para que el tono varíe y sea más tenebroso
            setInterval(() => {
                const randomFreq = 35 + Math.random() * 15;
                osc1.frequency.exponentialRampToValueAtTime(randomFreq, audioCtx.currentTime + 0.5);
            }, 500);
        }

        // Simular pantalla completa para más realismo
        function requestFullScreen() {
            const doc = document.documentElement;
            if (doc.requestFullscreen) {
                doc.requestFullscreen();
            } else if (doc.mozRequestFullScreen) {
                doc.mozRequestFullScreen();
            } else if (doc.webkitRequestFullscreen) {
                doc.webkitRequestFullscreen();
            } else if (doc.msRequestFullscreen) {
                doc.msRequestFullscreen();
            }
        }

        // Evento cuando la víctima hace clic en la pantalla
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            requestFullScreen();
            playScarySound();
        });
    </script>
</body>
</html>
